program: sweep.py
method: bayes        # Bayesian search — smarter than random/grid for 4+ params
metric:
  name: val_accuracy
  goal: maximize

parameters:
  learn_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  dropout:
    values: [0.1, 0.2, 0.3, 0.4]
  layer_1_size:
    values: [32, 64]
  batch_size:
    values: [32, 64, 128]
  epochs:
    value: 5          # keep sweep runs short
  sample:
    value: 10000      # subsample for speed during sweep