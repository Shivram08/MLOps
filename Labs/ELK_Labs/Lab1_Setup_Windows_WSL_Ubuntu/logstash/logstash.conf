input {
  file {
    path => "/logstash_dir/training.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # Parse the base log line: timestamp - level - message
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_timestamp} - %{LOGLEVEL:log_level} - %{GREEDYDATA:log_message}"
    }
  }

  # Extract epoch number
  grok {
    match => { "log_message" => "Epoch: %{NUMBER:epoch:int}" }
    tag_on_failure => []
  }

  # Extract training loss
  grok {
    match => { "log_message" => "^Loss: %{NUMBER:loss:float}" }
    tag_on_failure => []
  }

  # Extract training accuracy
  grok {
    match => { "log_message" => "^Accuracy: %{NUMBER:accuracy:float}" }
    tag_on_failure => []
  }

  # Extract validation loss
  grok {
    match => { "log_message" => "Val Loss: %{NUMBER:val_loss:float}" }
    tag_on_failure => []
  }

  # Extract validation accuracy
  grok {
    match => { "log_message" => "Val Accuracy: %{NUMBER:val_accuracy:float}" }
    tag_on_failure => []
  }

  # Extract final model accuracy
  grok {
    match => { "log_message" => "Model Accuracy: %{NUMBER:model_accuracy:float}" }
    tag_on_failure => []
  }

  # Extract F1 score
  grok {
    match => { "log_message" => "F1 Score: %{NUMBER:f1_score:float}" }
    tag_on_failure => []
  }

  # Extract per-class accuracy (e.g. "Per-class accuracy [airplane]: 0.7200")
  grok {
    match => { "log_message" => "Per-class accuracy \[%{WORD:class_name}\]: %{NUMBER:class_accuracy:float}" }
    tag_on_failure => []
  }

  # Parse log timestamp into @timestamp
  date {
    match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss,SSS"]
    target => "@timestamp"
  }

  # Clean up the raw message field
  mutate {
    remove_field => ["message", "log_timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "cifar10-logstash-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}